site_name: 長線投資入門
site_description: 由零開始嘅被動指數投資指南 — 免費、任睇、傳承落去
site_author: 津路茶
site_url: https://OolongTea2025.github.io/long-term-investing/
repo_url: https://github.com/OolongTea2025/long-term-investing
repo_name: OolongTea2025/long-term-investing

theme:
  name: material
  custom_dir: overrides   # overrides/main.html = 分享用嘅 og/twitter meta;overrides/404.html = 自訂 404
  language: zh-Hant
  favicon: images/favicon.svg
  logo: images/logo.svg
  font: false            # 中文用系統字型,唔 load 外部 webfont(快、私隱好)
  features:
    # navigation.instant 拿走咗（2026-07-25，加台灣版嗰陣）：
    # 佢同 mkdocs-static-i18n 嘅「語言切換去返同一頁」唔兼容，
    # 而且會令 mkdocs build --strict 出 warning 直接 fail 咗 CI。
    # 換返嚟：讀者喺第 9 章撳「繁體中文」，會去到台灣版第 9 章而唔係首頁。
    # 個站係靜態、又冇 load 外部字型，全頁 reload 嘅代價好細。
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tooltips
  palette:
    # 預設淺色(唔跟系統),右上角仍可切換深色
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 轉深色
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 轉淺色

plugins:
  # 中文搜尋：Material 一見到裝咗 jieba 就會自動分詞，並且用零寬空格接返
  # 啲詞；zh-Hant 嘅預設 separator 已經識斷 ​，所以唔使自己寫 separator。
  # 但 jieba 嘅預設詞典係普通話語料，會將「投資」切成「投｜資」，
  # 亦切唔出「再平衡」呢類術語 —— 所以要落自訂詞典。
  - search:
      jieba_dict_user: jieba_user_dict.txt
  # 多語言。檔案結構 = suffix：xxx.md 係廣東話（預設、留喺根目錄），
  # xxx.zh-TW.md 係台灣版（行 /zh-TW/），xxx.en.md 係英文版（行 /en/）。
  # 廣東話版**必須**留喺根，否則已經分享咗出去嘅連結全部會斷。
  # 檔名刻意保持廣東話 —— 改檔名等於改 URL，三個語言共用同一套 URL 結構。
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh-HK
          default: true
          name: 廣東話
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          site_name: 長期投資入門
          site_description: 從零開始的被動指數投資指南 — 免費、隨便看、傳下去
          copyright: >-
            免費知識 · 歡迎自由分享與傳承 📖 ·
            內容採用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>
            授權（姓名標示 · 非商業性 · 相同方式分享）
          nav_translations:
            首頁: 首頁
            📍 搵自己嘅 Level: 📍 找出自己的 Level
            🟢 新手篇: 🟢 新手篇
            1　你適合主動定被動投資？: 1　你適合主動還是被動投資？
            2　被動指數係咩,散戶點解會輸: 2　被動指數是什麼,散戶為何會輸
            3　分散風險原理: 3　分散風險的原理
            4　點解買全世界: 4　為什麼買全世界
            5　你嘅第一個組合: 5　你的第一個組合
            6　行為偏誤點應對: 6　行為偏誤怎麼應對
            🟡 進階篇: 🟡 進階篇
            7　配置路線 & 槓桿: 7　配置路線 & 槓桿
            8　終身100%股票？: 8　終身100%股票？
            9　真正嘅風險: 9　真正的風險
            10　因子投資: 10　因子投資
            11　債券完整指南: 11　債券完整指南
            12　其他資產與迷思: 12　其他資產與迷思
            🔵 退休篇: 🔵 退休篇
            13　提早退休 & 要幾多錢: 13　提早退休 & 要多少錢
            14　提領策略 & 序列風險: 14　提領策略 & 序列風險
            🔴 進階選讀: 🔴 進階選讀
            A　市場點運作: A　市場怎麼運作
            B　資產定價模型: B　資產定價模型
            C　各因子成因: C　各因子成因
            D　行為金融學 & 市場異象: D　行為金融學 & 市場異象
            E　硬核資產定價: E　硬核資產定價
            F　因子進階: F　因子進階
            📚 附錄: 📚 附錄
            A　邏輯謬誤 & 思維工具: A　邏輯謬誤 & 思維工具
            B　窮人點投資: B　窮人怎麼投資
            C　參考書單 & 來源: C　參考書單 & 來源
            🎮 互動遊戲: 🎮 互動遊戲
        - locale: en
          name: English
          build: true
          site_name: Long-Term Investing 101
          site_description: >-
            A beginner's guide to passive index investing —
            free, open to everyone, made to be passed on.
          copyright: >-
            Free knowledge · share it and pass it on 📖 ·
            Licensed <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>
            (Attribution · NonCommercial · ShareAlike)
          nav_translations:
            首頁: Home
            📍 搵自己嘅 Level: 📍 Find your Level
            🟢 新手篇: 🟢 Beginner
            1　你適合主動定被動投資？: 1. Active or passive — which are you?
            2　被動指數係咩,散戶點解會輸: 2. What indexing is, and why most people lose
            3　分散風險原理: 3. How diversification actually works
            4　點解買全世界: 4. Why buy the whole world
            5　你嘅第一個組合: 5. Your first portfolio
            6　行為偏誤點應對: 6. Handling your own biases
            🟡 進階篇: 🟡 Intermediate
            7　配置路線 & 槓桿: 7. Allocation path & leverage
            8　終身100%股票？: 8. 100% stocks for life?
            9　真正嘅風險: 9. What risk really is
            10　因子投資: 10. Factor investing
            11　債券完整指南: 11. Bonds — the full guide
            12　其他資產與迷思: 12. Other assets & myths
            🔵 退休篇: 🔵 Retirement
            13　提早退休 & 要幾多錢: 13. Early retirement & how much you need
            14　提領策略 & 序列風險: 14. Withdrawal strategy & sequence risk
            🔴 進階選讀: 🔴 Optional deep dives
            A　市場點運作: A. How markets work
            B　資產定價模型: B. Asset pricing models
            C　各因子成因: C. Where the factors come from
            D　行為金融學 & 市場異象: D. Behavioural finance & anomalies
            E　硬核資產定價: E. Hardcore asset pricing
            F　因子進階: F. Factors, advanced
            📚 附錄: 📚 Appendix
            A　邏輯謬誤 & 思維工具: A. Logical fallacies & thinking tools
            B　窮人點投資: B. Investing when money is tight
            C　參考書單 & 來源: C. Reading list & sources
            🎮 互動遊戲: 🎮 Interactive game

hooks:
  # build 完之後將搜尋索引按語言拆兩份(廣東話 / 台灣版),否則兩邊搜尋
  # 會撈埋一齊出結果。另一半喺 overrides/main.html。詳情見個檔頭嘅註解。
  - hooks/i18n_search_split.py
  # 根目錄 404.html 會畀最後 build 嗰個語言（台灣版）覆寫,呢個 hook 寫返
  # 預設語言（廣東話）嗰版落去。詳情見個檔頭嘅註解。
  - hooks/default_lang_404.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/resume.js
  - javascripts/figzoom.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

