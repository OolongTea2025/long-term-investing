<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="一個關於認知偏誤嘅廣東話互動故事。七十個決定，二十年，一個乜都冇做嘅對照組。">
<meta name="color-scheme" content="dark">
<title>烏龍茶的投資人生</title>
<style>
:root{
 --ink:#12140f; --paper:#e8e4d9; --paper2:#d6d1c2;
 --jade:#4a6b5d; --jade-lt:#7a9e8f;
 --red:#c04a3e; --green:#4f9463;
 --gold:#c9a25c; --dim:#8d8878;
 --font-d:"Songti SC","Noto Serif TC","Source Han Serif TC",serif;
 --font-b:"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;
 --safe-b:env(safe-area-inset-bottom,0px);
 --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0b08;overscroll-behavior:none}
body{font-family:var(--font-b);color:var(--paper);
 display:flex;align-items:center;justify-content:center;
 -webkit-font-smoothing:antialiased}
/* 四行：頂欄 / 走勢圖 / 舞台 / 對話。
   走勢圖以前係 position:absolute 浮喺舞台上面，結果永遠壓住立繪塊面 ——
   立繪高度會跟螢幕變，浮層根本估唔中邊度先安全。做返真嘅 grid 行，
   數學上就唔可能再疊。 */
#app{position:relative;width:100%;max-width:1100px;
 height:100dvh;max-height:100dvh;overflow:hidden;
 display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
 background:#0a0b08}
/* Screens stack on top of the grid; only .on is laid out. */
.scr{display:none}
.scr.on{display:contents}
.scr.solo.on{display:block;grid-row:1/-1;overflow-y:auto;
 -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
button{font-family:inherit;color:inherit}
a{color:var(--gold)}

/* ============ shared button ============ */
.btn{display:inline-block;font-family:var(--font-d);font-size:15px;letter-spacing:.24em;
 padding:13px 30px;border:1px solid var(--gold);color:var(--gold);
 background:transparent;cursor:pointer;transition:background .25s,color .25s;
 text-indent:.24em;border-radius:2px}
.btn:hover,.btn:active{background:var(--gold);color:#0a0b08}
.btn.sm{font-size:12px;padding:9px 18px;letter-spacing:.16em}
.btn.ghost{border-color:rgba(232,228,217,.3);color:var(--paper2)}
.btn.ghost:hover{background:rgba(232,228,217,.14);color:var(--paper)}

/* ============ TITLE ============ */
#title{background:#0a0b08}
#title.on{display:grid;grid-row:1/-1;grid-template-rows:1fr;
 place-items:center;position:relative;overflow-y:auto}
#titleBg{position:absolute;inset:0;background-size:cover;background-position:center;
 opacity:.5;filter:saturate(.65)}
#title .veil{position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(10,11,8,.6) 0%,rgba(10,11,8,.25) 38%,rgba(10,11,8,.95) 100%)}
#title .inner{position:relative;z-index:2;padding:28px 22px calc(28px + var(--safe-b));
 width:100%;max-width:520px;text-align:center}
.t-eyebrow{font-family:var(--font-d);letter-spacing:.5em;font-size:10.5px;
 color:var(--gold);margin-bottom:16px;text-indent:.5em}
.t-main{font-family:var(--font-d);font-size:clamp(34px,8.5vw,62px);
 font-weight:600;letter-spacing:.06em;line-height:1.12;
 text-shadow:0 4px 30px rgba(0,0,0,.9)}
.t-sub{margin-top:12px;font-size:12.5px;color:var(--paper2);opacity:.85;letter-spacing:.1em}
.t-rule{width:48px;height:1px;background:var(--gold);margin:22px auto;opacity:.7}
.namewrap{margin:0 auto 18px;max-width:280px}
.namewrap label{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.2em;margin-bottom:7px}
#nameIn{width:100%;background:rgba(232,228,217,.07);border:1px solid rgba(232,228,217,.22);
 color:var(--paper);font-family:var(--font-d);font-size:18px;text-align:center;
 padding:10px;border-radius:2px;letter-spacing:.1em}
#nameIn:focus{outline:none;border-color:var(--gold)}
.t-note{margin-top:22px;font-size:11.5px;color:var(--dim);line-height:1.95}
.t-note b{color:var(--paper2);font-weight:600}
#contWrap{margin-top:12px}
#contInfo{font-size:10.5px;color:var(--dim);margin-top:6px;letter-spacing:.06em}
.t-links{margin-top:24px;font-size:11px;color:var(--dim);line-height:2}

/* ============ TOP BAR ============ */
#topbar{position:relative;z-index:12;display:flex;align-items:stretch;gap:8px;
 padding:calc(6px + var(--safe-t)) 10px 6px;background:#0a0b08}
.tb-when{font-family:var(--font-d);letter-spacing:.06em;color:var(--paper2);
 display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.tb-when b{font-size:17px;color:var(--paper)}
.tb-when .sm{font-size:10.5px;color:var(--dim)}
.tb-phase{font-size:9.5px;letter-spacing:.22em;color:var(--gold);text-indent:.22em;margin-top:1px}
.tb-money{margin-left:auto;text-align:right;line-height:1.5;font-size:11px;
 font-variant-numeric:tabular-nums}
.tb-money .row{display:flex;justify-content:flex-end;gap:10px}
.tb-money .lbl{color:var(--dim);font-size:9.5px;align-self:center}
.tb-money .bench{color:var(--jade-lt)}
.up{color:var(--green)}.dn{color:var(--red)}
.iconbtn{width:30px;height:30px;flex-shrink:0;border:1px solid rgba(232,228,217,.26);
 background:rgba(10,11,8,.55);color:var(--paper2);border-radius:50%;cursor:pointer;
 font-size:13px;display:flex;align-items:center;justify-content:center;align-self:flex-start}
.iconbtn.ok{border-color:var(--jade-lt);color:var(--jade-lt)}
#tbBtns{display:flex;gap:6px;align-self:flex-start;margin-left:8px}

/* ============ STAGE ============ */
#stagewrap{position:relative;overflow:hidden;min-height:0}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;
 transition:opacity .45s;will-change:opacity}
#bgVeil{position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(10,11,8,.42) 0%,rgba(10,11,8,.12) 28%,rgba(10,11,8,.5) 68%,rgba(10,11,8,.95) 100%)}
/* The figure is bottom-anchored inside the stage row and scales with the row,
   so it can never be resized by the dialogue growing — the dialogue lives in
   its own grid row and simply takes the space it needs. */
#figs{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
 pointer-events:none}
#figs img{position:absolute;bottom:0;height:100%;width:auto;max-width:130%;
 object-fit:contain;object-position:bottom center;
 filter:drop-shadow(0 14px 34px rgba(0,0,0,.75));
 opacity:0;transition:opacity .42s ease}
#figs img.in{opacity:1}
#stagewrap::after{content:'';position:absolute;left:0;right:0;bottom:0;height:22%;
 pointer-events:none;background:linear-gradient(180deg,transparent,rgba(10,11,8,.85))}
/* 走勢圖：自己一行，永遠唔會壓住立繪。點一下可以放大。 */
#chartWrap{position:relative;margin:0 10px 4px;height:42px;
 background:rgba(232,228,217,.045);border:1px solid rgba(232,228,217,.10);
 border-radius:3px;overflow:hidden;cursor:pointer;transition:height .3s}
#chartWrap.big{height:min(34dvh,200px)}
#chart{width:100%;height:100%;display:block}
#chartHint{position:absolute;right:6px;bottom:3px;font-size:8.5px;color:var(--dim);
 letter-spacing:.1em;pointer-events:none}

/* ============ DIALOGUE ============ */
#dlg{position:relative;z-index:10;padding:0 10px calc(10px + var(--safe-b));
 max-height:64dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
 overscroll-behavior:contain}
.sig{display:block;font-size:12.5px;color:#f3d99b;letter-spacing:.06em;
 border-left:3px solid var(--gold);padding:7px 11px;margin-bottom:8px;
 line-height:1.7;font-weight:500;background:rgba(12,14,10,.94);
 border-radius:0 3px 3px 0;box-shadow:0 2px 14px rgba(0,0,0,.5)}
.namep{display:inline-block;font-family:var(--font-d);font-size:13px;letter-spacing:.12em;
 color:var(--paper);background:var(--jade);padding:3px 12px;border-radius:2px 2px 0 0;
 position:relative;z-index:2;top:1px}
.txtbox{background:rgba(18,20,15,.95);border:1px solid rgba(232,228,217,.13);
 border-radius:2px;padding:12px 13px;font-size:14.5px;line-height:1.9;
 color:var(--paper);letter-spacing:.02em}
#body::after{content:'▾';margin-left:5px;color:var(--gold);animation:bl 1.1s infinite}
@keyframes bl{0%,100%{opacity:0}50%{opacity:1}}
#opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt{text-align:left;background:rgba(18,20,15,.95);
 border:1px solid rgba(232,228,217,.2);color:var(--paper);
 padding:11px 12px;font-size:13.5px;line-height:1.55;cursor:pointer;
 border-radius:2px;transition:background .18s,border-color .18s;
 display:flex;align-items:center;gap:10px}
.opt .k{flex-shrink:0;font-family:var(--font-d);font-size:10.5px;color:var(--gold);
 border:1px solid rgba(201,162,92,.5);width:20px;height:20px;
 display:flex;align-items:center;justify-content:center;border-radius:50%}
.opt .otxt{flex:1}
.opt:hover:not(:disabled){background:rgba(74,107,93,.5);border-color:var(--jade-lt)}
.opt:disabled{opacity:.32;cursor:default}
.opt.extra{border-style:dashed;border-color:rgba(201,162,92,.45)}
.opt .btag{font-size:9.5px;color:var(--gold);opacity:.9;flex-shrink:0;
 border:1px solid rgba(201,162,92,.35);padding:2px 5px;border-radius:2px}
#res{margin-top:8px;padding:11px 12px;background:rgba(74,107,93,.22);
 border-left:2px solid var(--jade-lt);font-size:13.5px;line-height:1.8;
 display:none;border-radius:0 2px 2px 0}
#res.on{display:block}
#resWhy{margin-top:7px;padding-top:7px;border-top:1px dashed rgba(201,162,92,.3);
 font-size:11.5px;color:var(--paper2);line-height:1.75}
#resWhy .tag{color:var(--gold);font-family:var(--font-d);letter-spacing:.08em}
#next{margin-top:9px;width:100%;text-align:center}

/* ============ OVERLAY CARD (review / backlog / settings) ============ */
.ovl{position:absolute;inset:0;z-index:40;display:none;
 align-items:center;justify-content:center;padding:14px;
 background:rgba(6,7,5,.92);backdrop-filter:blur(8px);overflow-y:auto}
.ovl.on{display:flex}
.card{width:100%;max-width:520px;background:rgba(16,18,13,.97);
 border:1px solid rgba(201,162,92,.3);border-radius:3px;padding:20px 18px;
 box-shadow:0 18px 60px rgba(0,0,0,.7);margin:auto}
.card h2{font-family:var(--font-d);font-size:24px;letter-spacing:.08em;font-weight:600;margin-top:6px}
.eyebrow{font-size:9.5px;letter-spacing:.32em;color:var(--gold);text-indent:.32em}
.rule{width:40px;height:1px;background:var(--gold);margin:12px 0 14px;opacity:.75}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;
 border-bottom:1px solid rgba(232,228,217,.09);font-variant-numeric:tabular-nums;gap:8px}
.kv .l{color:var(--dim)}
.kv .v{font-family:var(--font-d);text-align:right}
.verdict{font-size:13px;line-height:1.95;color:var(--paper2);
 border-left:2px solid var(--jade-lt);padding:9px 11px;
 background:rgba(74,107,93,.16);border-radius:0 2px 2px 0;margin-bottom:11px}
.cardbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
canvas.cv{width:100%;background:rgba(232,228,217,.035);border-radius:2px;display:block}
#logList{max-height:56dvh;overflow-y:auto;margin:-4px -4px 0;padding:4px}
.logrow{border-left:2px solid rgba(232,228,217,.16);padding:7px 0 7px 11px;
 margin-bottom:8px;font-size:12.5px;line-height:1.7}
.logrow .t{color:var(--dim);font-size:10.5px;letter-spacing:.08em}
.logrow .b{color:var(--gold);font-size:11px}
.setrow{display:flex;justify-content:space-between;align-items:center;
 padding:9px 0;border-bottom:1px solid rgba(232,228,217,.09);font-size:13px}
.seg{display:flex;gap:0;border:1px solid rgba(232,228,217,.22);border-radius:2px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 11px;font-size:11.5px;
 color:var(--paper2);cursor:pointer}
.seg button.on{background:var(--gold);color:#0a0b08}

/* ============ ENDING ============ */
#end{background:#0a0b08}
#endCg{width:100%;aspect-ratio:16/9;background-size:cover;background-position:center;position:relative}
#endCg::after{content:'';position:absolute;inset:0;
 background:linear-gradient(180deg,transparent 42%,#0a0b08 100%)}
.epad{padding:0 18px calc(40px + var(--safe-b));max-width:660px;margin:0 auto;width:100%}
.e-name{font-family:var(--font-d);font-size:clamp(28px,7vw,44px);letter-spacing:.1em;
 margin-top:-34px;position:relative;z-index:2;text-shadow:0 3px 22px #000}
.e-tag{font-size:10.5px;letter-spacing:.24em;color:var(--gold);margin-bottom:12px;text-indent:.24em}
.e-desc{font-size:14.5px;line-height:2.05;color:var(--paper2);margin-bottom:22px}
.sec{margin:30px 0 10px;font-family:var(--font-d);font-size:12.5px;letter-spacing:.24em;
 color:var(--gold);border-bottom:1px solid rgba(201,162,92,.28);padding-bottom:6px;text-indent:.24em}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;font-size:13.5px;
 border-bottom:1px solid rgba(232,228,217,.09);font-variant-numeric:tabular-nums}
.stat .v{font-family:var(--font-d);text-align:right}
.note{font-size:12.5px;line-height:1.95;color:var(--paper2);
 background:rgba(192,74,62,.14);border-left:2px solid var(--red);
 padding:12px 13px;margin-top:12px;border-radius:0 2px 2px 0}
.note.good{background:rgba(79,148,99,.14);border-left-color:var(--green)}
.note.plain{background:rgba(232,228,217,.05);border-left-color:rgba(232,228,217,.3)}
.foot{margin-top:14px;font-size:11px;color:var(--dim);line-height:1.95}
/* attribution bars */
.attr{margin-bottom:11px}
.attr .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;gap:8px}
.attr .amt{font-family:var(--font-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.attr .track{height:8px;background:rgba(232,228,217,.09);border-radius:4px;overflow:hidden;
 display:flex;justify-content:flex-start}
.attr .track i{display:block;height:100%;border-radius:4px}
.attr .why{font-size:11px;color:var(--dim);line-height:1.7;margin-top:4px}
.attr .why a{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold)}
.biasrow{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12.5px}
.biasrow .bn{width:84px;flex-shrink:0;font-family:var(--font-d);font-size:11.5px}
.biasrow .bar{flex:1;height:6px;background:rgba(232,228,217,.1);border-radius:3px;overflow:hidden}
.biasrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),var(--gold))}
.biasrow .bc{width:20px;text-align:right;color:var(--dim);font-size:10.5px}
.biasdesc{font-size:11px;color:var(--dim);line-height:1.65;margin:-2px 0 10px 93px}
.biasdesc a{color:var(--gold);text-decoration:none;border-bottom:1px dotted rgba(201,162,92,.6)}
.mikeimg{width:100%;border-radius:2px;margin-top:8px;display:block}
.endbtns{display:flex;gap:8px;margin-top:28px;flex-wrap:wrap}

/* ============ market shock feedback ============ */
#flash{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;
 transition:opacity .5s ease}
#flash.hit{opacity:1;transition:opacity .08s ease}
@keyframes shk{0%,100%{transform:translate(0,0)}
 20%{transform:translate(-4px,2px)}40%{transform:translate(3px,-2px)}
 60%{transform:translate(-2px,-2px)}80%{transform:translate(3px,1px)}}
#app.shake{animation:shk .4s ease}

/* ============ responsive ============ */
@media(min-width:700px){
 .txtbox{font-size:15.5px}
 .sig{font-size:13.5px}
 .opt{font-size:14.5px;padding:12px 14px}
 #topbar{padding:calc(10px + var(--safe-t)) 16px 8px}
 #dlg{padding:0 16px calc(14px + var(--safe-b))}
 #chartWrap{margin:0 16px 6px;height:52px}
 .tb-money{font-size:12px}
}
/* 橫屏手機：改做左右兩欄（立繪左、對話右）—— 即係一般 galgame 嘅橫屏做法。
   之前用返直屏嘅上下佈局，對話框食咗 76dvh，中間個 stage 行被壓到零高，
   而立繪係 height:100%，所以成個人就唔見咗。唔鎖直屏：iOS Safari 本身
   鎖唔到，而且橫屏先係視覺小說嘅原生格式。 */
@media(orientation:landscape) and (max-height:560px){
 #app{grid-template-rows:auto auto minmax(0,1fr);
      grid-template-columns:minmax(0,38%) minmax(0,62%)}
 #topbar{grid-area:1/1/2/3}
 #chartWrap{grid-area:2/1/3/3;height:30px;margin:0 10px 3px}
 #stagewrap{grid-area:3/1/4/2}
 #dlg{grid-area:3/2/4/3;max-height:none;padding:0 10px calc(8px + var(--safe-b)) 4px}
 #title.on,#end.on,.scr.solo.on{grid-column:1/-1;grid-row:1/-1}
 #chartWrap.big{height:64px}
 #chartHint{display:none}
 #stagewrap::after{height:14%}
 .txtbox{font-size:13px;line-height:1.7;padding:8px 10px}
 .opt{padding:7px 10px;font-size:12.5px;gap:8px}
 .sig{font-size:11px;padding:5px 9px;margin-bottom:5px;line-height:1.55}
 .namep{font-size:11.5px;padding:2px 9px}
 #topbar{padding:calc(3px + var(--safe-t)) 10px 3px}
 .tb-when b{font-size:15px}
}
/* 矮但唔係橫屏（例如分屏、細窗）：淨係縮，唔換佈局 */
@media(max-height:560px) and (orientation:portrait){
 #chartWrap{height:34px}
 #dlg{max-height:68dvh}
 .txtbox{font-size:13.5px;line-height:1.75;padding:9px 11px}
 .opt{padding:8px 11px;font-size:13px}
 .sig{font-size:11.5px;padding:5px 9px;margin-bottom:6px}
}
@media(prefers-reduced-motion:reduce){
 *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div id="app">
<div id="flash"></div>

<!-- ============ TITLE ============ -->
<section class="scr on" id="title">
 <div id="titleBg"></div><div class="veil"></div>
 <div class="inner">
  <div class="t-eyebrow" data-t="titleEyebrow">投資行為模擬</div>
  <h1 class="t-main" data-th="titleMain">烏龍茶的<br>投資人生</h1>
  <div class="t-sub" data-t="titleSub">七十個決定 · 二十年 · 一個對照組</div>
  <div class="t-rule"></div>
  <div class="namewrap">
   <label data-t="nameLabel">你嘅名</label>
   <input id="nameIn" maxlength="8" value="烏龍茶" autocomplete="off">
  </div>
  <button class="btn" id="startBtn" data-t="btnStart">開始</button>
  <div id="contWrap" style="display:none">
   <button class="btn sm ghost" id="contBtn" data-t="btnContinue">繼續上次進度</button>
   <div id="contInfo"></div>
  </div>
  <!-- 內容由 ui.js 填（要塞返起步金額，而金額跟語言換貨幣） -->
  <p class="t-note" id="tNote"></p>
  <div class="t-links">
   <a href="../新手篇/06-行為偏誤點應對/" id="lnkCh6" data-t="backToSite">← 返《長線投資入門》</a>
  </div>
 </div>
</section>

<!-- ============ GAME ============ -->
<section class="scr" id="game">
 <div id="topbar">
  <div>
   <div class="tb-when"><b id="tNum">1</b><span class="sm">/70</span>
    <span class="sm" id="tWhen">第 0 年 · 30歲</span></div>
   <div class="tb-phase" id="tPhase">新手期</div>
  </div>
  <div class="tb-money">
   <div class="row"><span class="lbl" data-t="hudYou">你</span><span id="hNav"></span></div>
   <div class="row"><span class="lbl">Mike</span><span class="bench" id="hBen"></span></div>
   <div class="row"><span class="lbl" data-t="hudGap">差距</span><span id="hGap">—</span></div>
  </div>
  <div id="tbBtns">
   <button class="iconbtn" id="logBtn" title="決定紀錄" aria-label="決定紀錄"
    data-t-title="logTitle" data-t-aria="logTitle">☰</button>
   <button class="iconbtn" id="setBtn" title="設定" aria-label="設定"

/* ===================== i18n.js ===================== */
/* ============================================================
   多語言層

   設計原則：**廣東話係 canonical，其他語言係 overlay。**

   即係話 scen1/2/3.js、bias.js、judge.js 入面嗰啲廣東話字，
   全部原封不動留喺原位；`lang/zh-TW.js` 只係一份「同一個 key 換另一句」
   嘅對照表，開波嗰陣先蓋上去。

   咁樣做嘅好處係：漏咗一句冇譯，玩家見到嘅係一句廣東話，
   唔係一個爛咗嘅介面或者 undefined。譯漏嘅風險由「壞版面」
   降級做「未譯」，而未譯嗰啲由 test.mjs 嘅覆蓋率檢查捉返。

   唯一例外係 ui.js —— 佢啲字串本身寫死喺 function 入面，
   冇得「蓋」，所以全部抽咗出嚟做 `ui:{}` 查表，廣東話嗰份
   住喺 lang/zh-HK.js。
   ============================================================ */

var LANGS = {};                 /* 由 lang/*.js 自己註冊入嚟 */
var DEFAULT_LANG = 'zh-HK';
var LANG = DEFAULT_LANG;
var L = null;                   /* 而家生效嗰個 locale */

function LC() { return L || LANGS[LANG] || LANGS[DEFAULT_LANG] || {}; }
function LBASE() { return LANGS[DEFAULT_LANG] || {}; }

/* 查 UI 字串。{0} {1} … 會被之後嘅參數填返。
   查唔到就跌返廣東話；連廣東話都冇先至出 ⟪key⟫（即係我漏咗嘢）。 */
function t(k) {
  var s = (LC().ui || {})[k];
  if (s == null) s = (LBASE().ui || {})[k];
  if (s == null) return '⟪' + k + '⟫';
  for (var i = 1; i < arguments.length; i++) s = s.split('{' + (i - 1) + '}').join(arguments[i]);
  return s;
}

/* ---------- 貨幣 ----------
   模型內部永遠用同一套數（港元），唔會跟語言變 ——
   換語言唔可以換咗個遊戲嘅難度。呢度淨係換顯示：
   台灣版將所有金額 ×4 再標 NT$，所以兩邊玩落去嘅
   平衡、機率、結局分佈完全一樣。 */
function curRate() { var c = LC().cur; return (c && c.rate) || 1; }
function curSym() { var c = LC().cur; return (c && c.sym) || '$'; }
function fmt(n) { return curSym() + Math.round(n * curRate()).toLocaleString('en-US'); }
function fmtSigned(n) {
  return (n < 0 ? '-' : '+') + curSym() + Math.abs(Math.round(n * curRate())).toLocaleString('en-US');
}

/* ---------- 揀語言 ----------
   次序：網址 ?lang= > 上次揀過嗰個 > 廣東話。
   刻意唔睇 navigator.language —— 網站兩個版嘅遊戲連結
   都會明寫 ?lang=，讀者撳邊個版就係邊個版，唔會有驚喜。 */
function pickLang(saved) {
  var q = '';
  try { q = ((String(location.search).match(/[?&]lang=([\w-]+)/) || [])[1]) || ''; } catch (e) {}
  if (q && LANGS[q]) return q;
  if (saved && LANGS[saved]) return saved;
  return DEFAULT_LANG;
}
function setLang(code) { LANG = LANGS[code] ? code : DEFAULT_LANG; L = LANGS[LANG]; return LANG; }

/* ---------- 將 overlay 蓋落資料上面 ----------
   全部都係「有先蓋，冇就唔郁」。 */
function overlayPairs(target, src, fields) {
  if (!src) return;
  for (var k in src) {
    if (!target[k]) continue;
    for (var i = 0; i < fields.length; i++) {
      var f = fields[i];
      if (src[k][f] != null) target[k][f] = src[k][f];
    }
  }
}
function applyLocale() {
  var lc = LC();
  /* NAMES 住喺 ui.js（瀏覽器側），Node 測試嗰邊冇，所以要 guard。 */
  if (lc.names && typeof NAMES !== 'undefined') for (var k in lc.names) NAMES[k] = lc.names[k];
  if (lc.phase) for (var p in lc.phase) PHASE_LABEL[p] = lc.phase[p];

  /* 章節連結：名同 href 兩樣都換（台灣版嘅章節喺 ../zh-TW/ 之下） */
  if (lc.ch) for (var c in lc.ch) if (CH[c]) CH[c] = lc.ch[c];

  /* 偏誤：[名, 一句話解釋]，第三個（對應章節）唔郁 */
  if (lc.bias) for (var b in lc.bias) {
    if (!BIAS[b]) continue;
    if (lc.bias[b][0]) BIAS[b][0] = lc.bias[b][0];
    if (lc.bias[b][1]) BIAS[b][1] = lc.bias[b][1];
  }

  /* 結局：n 名 / tag 標籤 / d 描述 */
  overlayPairs(ENDING_INFO, lc.ending, ['n', 'tag', 'd']);

  /* 場景：sig / txt / opts[i] 嘅 t / r / why。
     d{}（真正影響模型嗰啲數）同 b（偏誤 key）永遠唔會被 overlay 掂到，
     所以譯錯字都唔可能整壞平衡。 */
  if (lc.scen) applyScenLocale(lc.scen);
}
function applyScenLocale(tbl) {
  var all = SCEN_ROOKIE.concat(SCEN_MID, SCEN_VET);
  for (var i = 0; i < all.length; i++) {
    var s = all[i], o = tbl[s.id];
    if (!o) continue;
    if (o.sig != null) s.sig = o.sig;
    if (o.txt != null) s.txt = o.txt;
    if (o.opts) for (var j = 0; j < s.opts.length && j < o.opts.length; j++) {
      var a = s.opts[j], b = o.opts[j];
      if (!b) continue;
      if (b.t != null) a.t = b.t;
      if (b.r != null) a.r = b.r;
      if (b.why != null) a.why = b.why;
    }
  }
}

/* ---------- 版面上面嘅靜態文字 ----------
   shell.html 保留廣東話原文（可讀、亦係 fallback），
   元素身上掛 data-t / data-th / data-t-title / data-t-aria。
   廣東話版乜都唔使做，其他語言先至逐個換。 */
function applyLocaleDOM() {
  if (LANG === DEFAULT_LANG) return;
  var ui = LC().ui || {};
  var put = function (attr, fn) {
    var els = document.querySelectorAll('[' + attr + ']');
    for (var i = 0; i < els.length; i++) {
      var key = els[i].getAttribute(attr);
      if (ui[key] != null) fn(els[i], ui[key]);
    }
  };
  put('data-t', function (el, v) { el.textContent = v; });
  put('data-th', function (el, v) { el.innerHTML = v; });
  put('data-t-title', function (el, v) { el.setAttribute('title', v); });
  put('data-t-aria', function (el, v) { el.setAttribute('aria-label', v); });
  if (ui.docTitle) document.title = ui.docTitle;
  var md = document.querySelector('meta[name="description"]');
  if (md && ui.metaDesc) md.setAttribute('content', ui.metaDesc);
}

/* 開波：揀語言、蓋 overlay、set <html lang>。 */
function initLang(saved) {
  setLang(pickLang(saved));
  applyLocale();
  try { document.documentElement.setAttribute('lang', LC().htmlLang || LANG); } catch (e) {}
  applyLocaleDOM();
  return LANG;
}

/* ===================== lang/en.scen.js ===================== */
/* The 70 scenarios in English.

   Only sig / txt / opts[i].t / .r / .why live here — all plain prose.
   d{} (the numbers that drive the model) and b (the bias key) are NOT
   in this file, so nothing here can affect game balance.

   Amounts are scaled by hand at cur.rate = 0.125, because prose
   numbers never pass through fmt(). Setting is generic-international:
   the diner became a diner anywhere, 師兄 became Kenny. */

LANGS['en'].scen = {

/* ===================== model.js ===================== */
/* ============================================================
   經濟模型 — the honest version.

   Design rule: every dollar the player loses relative to Mike must be
   traceable to a named mechanism the teaching site actually explains.
   There are NO hidden "ego tax" or "discipline bonus" return modifiers;
   自我同紀律只係敘事變數，唔會直接加減回報。

   Mechanisms, and where the site covers them:
     1. 交易成本 / 產品費用        -> Ch2 費用蠶食
     2. 唔喺市場（擇時、恐慌沽）   -> Ch2 錯過最好嘅日子
     3. 集中持倉（個股中位數效應） -> Ch3 分散 / 99-01 法則
     4. 槓桿（利息 + 強制平倉）    -> Ch7 槓桿
     5. 持續投入同人工增長         -> Ch5 定額定投 / Ch7 人力資本

   數字全部係名義港元。一個回合約等於一季。
   ============================================================ */

var TURNS = 70;
var START = 300000;      // 起步淨值
var CONTRIB0 = 20000;    // 每回合儲到嘅錢（基準）

/* ---------- 時間 ----------
   turn 1-20  -> 第 0-5 年    (每回合 .25 年)
   turn 21-45 -> 第 5-12 年   (每回合 .28 年)
   turn 46-70 -> 第 12-20 年  (每回合 .32 年)
   Explicit, so the HUD and the script can never contradict each other. */
var TURN_YEAR = (function () {
  var a = [0];
  for (var t = 1; t <= TURNS; t++) a[t] = a[t - 1] + (t <= 20 ? 0.25 : t <= 45 ? 0.28 : 0.32);
  return a;
})();
var START_AGE = 30;
function yearAt(t) { return Math.round(TURN_YEAR[Math.max(0, Math.min(TURNS, t))] * 10) / 10; }
function ageAt(t) { return Math.floor(START_AGE + TURN_YEAR[Math.max(0, Math.min(TURNS, t))]); }

/* ---------- 利率（每回合，名義） ---------- */
var CASH_YIELD = 0.005;     // 現金放銀行 2%/年
var MARGIN_RATE = 0.0134;   // 孖展息 5.5%/年
var ROUND_TRIP = 0.0028;    // 一買一賣 0.28%：佣金 + 印花稅 + 價差
var FUND_FEE = 0.0002;      // 廣泛指數 ETF 0.08%/年
var MIKE_FEE = 0.0002;      // Mike 一樣要俾基金費 —— 冇免費午餐
var MAINT = 0.25;           // 孖展維持保證金：自有資金 / 總持倉
var FORCED_SLIP = 0.03;     // 被強制平倉嘅滑點（自己揀走就冇）

/* ---------- 市場：regime-switching，每回合一季 ---------- */
var REG = {
  bull: { mu: 0.032, sd: 0.055, next: { bull: .87, chop: .10, crash: .03 } },
  chop: { mu: 0.004, sd: 0.075, next: { bull: .26, chop: .64, crash: .10 } },
  crash: { mu: -0.105, sd: 0.115, next: { crash: .50, recov: .50 } },
  recov: { mu: 0.058, sd: 0.090, next: { bull: .45, recov: .40, chop: .15 } }
};

function mulberry32(a) {
  var f = function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  f.getState = function () { return a; };
  f.setState = function (v) { a = v | 0; };
  return f;
}
function gauss(rng) {
  var u = 0, v = 0;
  while (!u) u = rng();
  while (!v) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* 一次過生成成條市場路徑，並且記低每一個隨機數。
   咁樣「逐項移除」歸因先至係精確嘅：反事實重播用完全一樣嘅市場，
   兩者嘅差別就只可能係我哋郁咗嗰一樣嘢。 */
function makePath(seed, turns) {
  turns = turns || TURNS;
  var rng = mulberry32(seed), path = [], regime = 'bull';
  for (var t = 0; t < turns; t++) {
    var R = REG[regime];
    path.push({
      r: R.mu + R.sd * gauss(rng),   // 指數回報
      z: gauss(rng),                 // 個股特有衝擊
      uJump: rng(),                  // 會唔會爆單一股票地雷
      mJump: rng(),                  // 爆嘅話有幾深
      regime: regime
    });
    var p = rng(), acc = 0, nx = regime;
    for (var k in R.next) { acc += R.next[k]; if (p < acc) { nx = k; break; } }
    regime = nx;
  }
  return path;
}

/* ---------- 決定紀錄 ----------
   玩家揀完之後，我哋 snapshot 佢當時嘅姿態。
   用 dec[] 重播 path[] 可以完全重現成局遊戲。 */
function blankDecision() {
  return {
    invFrac: 0,   // 淨值入面有幾多成落咗市場 (0..1)
    conc: 0,      // 落咗市場嗰啲錢，有幾多成押喺一注度
    lev: 1,       // 總持倉倍數 (>=1)
    churn: 0,     // 呢個回合自主買賣幾多次
    volMult: 1,   // 嗰注有幾投機
    dca: 0,       // 有冇長期定額計劃
    indexed: 0,   // 落咗市場嗰啲錢係咪廣泛指數基金
    cashOut: 0,   // 一次性現金支出（課程、訂閱、借畀人）
    ig: 0.006     // 嗰個回合嘅人工增長率（事業選擇會郁佢）
  };
}

function newSim(contribRate) {
  return {
    cash: START, invested: 0, eq: START, levPrev: 1,
    contribRate: contribRate || CONTRIB0, contributed: 0, incomeGrowth: 0.006,
    tradeCost: 0, fundFee: 0, spent: 0, forced: 0, marginCost: 0,
    hist: [START], invFracHist: []
  };
}

/* ---------- 一個回合 ----------
   knobs 可以精確咁熄咗其中一個機制，用嚟做歸因。 */
function step(S, dec, p, knobs) {
  knobs = knobs || {};
  var invFrac = knobs.noTiming ? 1 : Math.max(0, Math.min(1, dec.invFrac));
  var conc = knobs.noConc ? 0 : Math.max(0, Math.min(1, dec.conc));
  var lev = knobs.noLev ? 1 : Math.max(1, dec.lev);
  var noCost = !!knobs.noCost;

  /* --- 1. 出糧，儲蓄入袋 --- */
  S.contributed += S.contribRate;
  S.cash += S.contribRate;
  var eq = S.cash + S.invested;

  /* --- 2. 一次性現金支出 --- */
  if (!noCost && dec.cashOut > 0) {
    var spend = Math.min(S.cash, eq * dec.cashOut);
    S.cash -= spend; S.spent += spend; eq -= spend;
  }

  /* --- 3. 調倉去目標姿態，買賣要俾錢 --- */
  var oldExposure = S.invested * S.levPrev;
  var newExposure = eq * invFrac * lev;
  if (!noCost) {
    var traded = Math.abs(newExposure - oldExposure) + Math.max(0, dec.churn) * newExposure;
    var cost = traded * ROUND_TRIP;
    S.tradeCost += cost;
    eq -= cost;
  }
  S.cash = eq * (1 - invFrac);
  S.invested = eq * invFrac;
  S.levPrev = lev;

  /* --- 4. 市場郁 ---
     集中持倉唔係「指數但波幅大啲」。指數嘅回報係由一小撮股票拉起，
     所以單一股票嘅平均數同指數一樣，但中位數低過指數 —— 大部分個股
     跑輸，得幾隻孭起晒成個市。呢個就係第 3 章嘅 99/01 效應，
     所以呢度照字面模擬：個股衝擊係平均值為 0 嘅對數常態，
     佢嘅中位數自然就係負數。 */
  var r = p.r, idio = 0;
  if (conc > 0) {
    /* 波幅封頂：就算你買咗全世界最投機嗰隻嘢，一個季度嘅個股波幅
       都唔應該離譜到令「揀錯一次」等同「一定死」。冇咗呢個上限，
       「大部分時候都醒目」同「次次都癲」嘅結果會一模一樣 ——
       咁個遊戲就變成講「你點做都冇用」，而唔係講機制。 */
    var sd = Math.min(0.20 * dec.volMult * Math.sqrt(conc), 0.42);
    idio = Math.exp(sd * p.z - sd * sd / 2) - 1;
    var pJump = 0.006 * conc * conc * Math.min(dec.volMult, 3);   // 造假、盈警、供股、除牌
    if (p.uJump < pJump) idio = (1 + idio) * (1 - (0.35 + p.mJump * 0.40)) - 1;
  }
  var concRet = (1 + r) * (1 + idio) - 1;
  var rp = (1 - conc) * r + conc * concRet;

  var exposure = S.invested * lev;
  var debt = S.invested * (lev - 1);
  var pnl = exposure * rp;
  var mc = debt * MARGIN_RATE;
  S.marginCost += mc;
  pnl -= mc;
  if (!noCost) {
    var fee = exposure * FUND_FEE * (dec.indexed ? 1 : 0.15);
    S.fundFee += fee;
    pnl -= fee;
  }
  S.invested += pnl;
  S.cash *= (1 + CASH_YIELD);

  /* --- 5. 強制平倉 --- */
  var forced = false;
  if (lev > 1.02) {
    var assets = S.invested * lev;
    if (assets <= 0 || S.invested / assets < MAINT) {
      forced = true; S.forced++;
      S.invested = Math.max(0, S.invested) * (1 - FORCED_SLIP);
      S.levPrev = 1;
      S.wasForced = true;   // engine 會順手幫你解除槓桿同集中 —— 你已經被斬晒
    }
  }
  if (S.invested < 0) { S.cash += S.invested; S.invested = 0; }

  S.eq = Math.max(0, S.cash + S.invested);
  S.hist.push(S.eq);
  S.invFracHist.push(invFrac);

  /* --- 6. 人工增長（第 7 章：人力資本先係後生仔最大嘅資產）---
     每個回合嘅增長率記喺 dec 度，所以反事實重播完全對得返。
     knobs.baseIncome = 「如果你嘅人工由頭到尾都冇特別加過會點」 */
  var g = knobs.baseIncome ? 0.006 : (dec.ig != null ? dec.ig : S.incomeGrowth);
  S.contribRate *= (1 + g);

  return { r: r, rp: rp, forced: forced, eq: S.eq };
}

/* Mike：第一日全部入市，之後每個回合照供，永遠唔郁。 */
function runMike(path, contribRate, turns) {
  var S = newSim(contribRate);
  S.invested = S.cash; S.cash = 0;
  turns = turns == null ? path.length : turns;
  for (var t = 0; t < turns; t++) {
    S.contributed += S.contribRate;
    S.invested += S.contribRate;
    var fee = S.invested * MIKE_FEE;
    S.fundFee += fee;
    S.invested = S.invested * (1 + path[t].r) - fee;
    S.eq = S.invested;
    S.hist.push(S.eq);
    S.contribRate *= (1 + S.incomeGrowth);
  }
  return S;
}

/* 用同一條市場路徑重播，但熄咗其中一個機制。 */
function replay(path, decs, knobs, contribRate) {
  var S = newSim(contribRate);
  for (var t = 0; t < decs.length; t++) step(S, decs[t], path[t], knobs);
  return S;
}


/* ===================== engine.js ===================== */
/* ============================================================
   純遊戲邏輯（完全冇掂 DOM）
   分開一份，係為咗可以喺 Node 度真係試玩幾千局嚟驗證數值，
   而唔係靠肉眼估。見 test.mjs。
   ============================================================ */

function newGame(name, seed) {
  seed = seed == null ? Math.floor(Math.random() * 1e9) : seed;
  var path = makePath(seed);
  return {
    seed: seed, name: name || t('defaultName'), turn: 0,
    path: path, mikeHist: runMike(path).hist,
    sim: newSim(), decs: [],
    posture: { invFrac: 0, conc: 0, lev: 1, volMult: 1, dca: 0, indexed: 0, ig: 0.006, churnCap: 99 },
    ego: 0, disc: 0, health: 0, commit: 0,
    biasCount: {}, biasLog: [], choices: [], reviewed: {},
    idleTurns: 0, ruinTurn: 0, ended: null
  };
}
function mikeAt(G, t) { return G.mikeHist[Math.min(t, G.mikeHist.length - 1)]; }
function phaseOf(t) { return t <= 20 ? 'rookie' : t <= 45 ? 'mid' : 'vet'; }
var PHASE_LABEL = { rookie: '新手期', mid: '中手期', vet: '老手期' };

/* 每回合開始，姿態自然演變。
   呢啲全部係真實嘅慣性，唔係暗中加減分：
   · 集中持倉黐身 —— 冇人會靜靜雞自己分散返
   · 槓桿同投機性會慢慢褪
   · 有長期定額計劃，你嘅儲蓄會自動流入市場（呢個就係計劃嘅意義） */
function drift(G) {
  var P = G.posture;
  /* 被強制平倉之後你冇得再揀 —— 券商幫你斬晒，槓桿同集中一次過清零。 */
  if (G.sim.wasForced) { G.sim.wasForced = false; P.lev = 1; P.conc *= 0.35; P.volMult = 1; }
  P.conc *= 0.92;
  P.lev = 1 + (P.lev - 1) * 0.96;
  P.volMult = 1 + (P.volMult - 1) * 0.85;
  if (P.dca) P.invFrac = Math.max(0, Math.min(1, P.invFrac + (1 - P.invFrac) * 0.08));
  if (P.invFrac < 0.75) G.idleTurns++; else G.idleTurns = 0;
}

/* 將一個選項嘅 d{} 套落姿態上面，然後 snapshot 出一個 decision。 */
function applyChoice(G, d, opt, scen) {
  var P = G.posture, cl = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  G.ego = cl(G.ego + (d.ego || 0), 0, 400);
  G.disc = cl(G.disc + (d.disc || 0), -300, 1400);
  G.health += (d.health || 0);
  G.commit = Math.max(0, G.commit + (d.commit || 0));
  if (d.inv != null) P.invFrac = cl(d.inv, 0, 1);
  if (d.dInv) P.invFrac = cl(P.invFrac + d.dInv, 0, 1);
  /* 集中度用遞減方式加：你已經好集中嘅時候，再「加注」實際上加得有限，
     而且冇人會 100% 押晒喺一注度（總會有啲現金、強積金、其他嘢）。
     用直加嘅話，玩幾個回合就會釘死喺 100%，跟住「醒目啲」同「癲晒」
     嘅結果就冇分別 —— 呢個唔係真實，亦都教唔到嘢。 */
  if (d.conc > 0) P.conc = cl(P.conc + d.conc * (1 - P.conc / 0.85), 0, 0.85);
  else if (d.conc < 0) P.conc = cl(P.conc + d.conc, 0, 0.85);
  if (d.lev != null) P.lev = Math.max(1, d.lev);
  if (d.dLev) P.lev = Math.max(1, P.lev + d.dLev);
  if (d.vol) P.volMult = Math.min(4, Math.max(P.volMult, d.vol));
  if (d.dca) P.dca = 1;
  if (d.indexed != null) {
    P.indexed = d.indexed;
    P.conc = P.conc * (1 - cl(d.indexed, 0, 1));   // 廣泛指數基金按定義唔係集中持倉
  }
  if (d.churnCap != null) P.churnCap = d.churnCap;
  if (d.income) P.ig = cl(P.ig + d.income, -0.004, 0.02);

  var churn = d.churn ? Math.min(d.churn, P.churnCap)
                      : Math.min(P.indexed >= 0.9 ? 0.01 : 0.04, P.churnCap);

  var dec = blankDecision();
  dec.invFrac = P.invFrac; dec.conc = P.conc; dec.lev = P.lev;
  dec.churn = churn; dec.volMult = P.volMult; dec.dca = P.dca;
  dec.indexed = P.indexed >= 0.5 ? 1 : 0; dec.cashOut = d.cashOut || 0; dec.ig = P.ig;
  G.decs.push(dec);

  if (opt && opt.b) {
    G.biasCount[opt.b] = (G.biasCount[opt.b] || 0) + 1;
    G.biasLog.push({ turn: G.turn, b: opt.b, scen: scen ? scen.id : 0 });
  }
  if (opt) G.choices.push({ turn: G.turn, scen: scen ? scen.id : 0, opt: opt.t, bias: opt.b || null });
  return dec;
}

/* 玩家揸咗好耐現金嗰陣，額外畀返一個返場選項。
   遊戲一定要有條路返場，否則一次恐慌沽貨就等於玩完 —— 咁就唔係教緊嘢，係懲罰。
   你隔咗幾耐先肯撳呢粒掣，本身就係「擇時代價」嘅量度。 */
function extraOption(G) {
  if (G.posture.invFrac >= 0.75 || G.idleTurns < 2) return null;
  return {
    t: t('extraOptTxt'), b: null, extra: true,
    d: { inv: 0.95, churn: 0.3, disc: 6 },
    r: t('extraOptRes'),
    why: t('extraOptWhy', G.idleTurns)
  };
}
function optionsFor(G, scen) {
  var list = scen.opts.slice(), ex = extraOption(G);
  if (ex) list.push(ex);
  return list;
}

/* 一個回合嘅純邏輯部分：套用選擇 -> 跑經濟 -> 回結果。 */
function commitChoice(G, opt, scen) {
  applyChoice(G, opt.d || {}, opt, scen);
  return step(G.sim, G.decs[G.decs.length - 1], G.path[G.turn - 1]);
}
function isRuined(G) { return G.sim.eq <= (START + G.sim.contributed) * 0.06; }

/* ===================== judge.js ===================== */
/* ============================================================
   結局判定 · 歸因分解 · Monte Carlo

   舊版嘅「技術分數」係循環論證：技術本身就係一個寫死嘅回報加成，
   所以「你係靠技術定靠彩數」呢條問題，答案早就寫咗喺公式入面。

   新版係咁分嘅：攞你實際做過嘅七十個決定，原封不動咁擺去幾百個
   唔同嘅市場歷史入面重跑。同一套行為，唔同嘅市場。
   如果你嘅行為喺大部分平行時空都跑贏 Mike —— 咁就係真嘢。
   如果淨係今次贏 —— 咁就係彩數。
   ============================================================ */

/* 攞你嘅決定序列，喺 n 個全新市場度重播。 */
function monteCarlo(decs, n) {
  n = n || 400;
  var ratios = [], win = 0;
  for (var i = 0; i < n; i++) {
    var p = makePath(Math.floor(Math.random() * 1e9), decs.length);
    var you = replay(p, decs, {}, CONTRIB0).eq;
    var mk = runMike(p, CONTRIB0, decs.length).eq;
    var r = mk > 0 ? you / mk : 0;
    ratios.push(r);
    if (r > 1) win++;
  }
  ratios.sort(function (a, b) { return a - b; });
  return { ratios: ratios, win: win / n, med: ratios[Math.floor(n / 2)] };
}

/* 逐項移除歸因：每次淨係熄一樣嘢，用返同一條市場路徑重播。 */
function attribute(G) {
  var path = G.path, decs = G.decs, you = G.sim.eq;
  var f = function (knobs) { return replay(path, decs, knobs, CONTRIB0).eq - you; };
  return {
    you: you,
    mike: G.mike.eq,
    gap: you - G.mike.eq,
    cost: f({ noCost: 1 }),
    timing: f({ noTiming: 1 }),
    conc: f({ noConc: 1 }),
    lev: f({ noLev: 1 }),
    all: f({ noCost: 1, noTiming: 1, noConc: 1, noLev: 1 }),
    income: -f({ baseIncome: 1 })   // 你嘅人工增長貢獻咗幾多（正數 = 幫到你）
  };
}

/* mcWin = 同一套行為喺其他市場跑贏 Mike 嘅比例 */
function judge(G, mcWin) {
  var S = G.sim;
  var base = START + S.contributed;
  var ratio = G.mike.eq > 0 ? S.eq / G.mike.eq : 0;
  var totalCost = S.tradeCost + S.fundFee + S.spent + S.marginCost;
  var biasN = G.biasLog.length;

  if (G.ruinTurn && G.ruinTurn <= 45) return 'EARLY_RUIN';
  if (S.eq < base * 0.15) return 'BLOWUP';
  if (ratio > 1.0) return mcWin >= 0.5 ? 'TRUE_ALPHA' : 'LUCKY_FOOL';
  /* 完全紀律嘅玩家會同 Mike 打成平手 —— 呢個唔係輸，呢個先係目標。 */
  if (ratio >= 0.98 && biasN <= 12 && totalCost < S.eq * 0.04) return 'WU_WEI';
  if (ratio >= 0.85 && G.posture.dca && G.posture.indexed >= 0.9) return 'AWAKENING';
  /* 「韭菜」講嘅係成本，唔係「做得差」。你落場二十年，付出去嘅
     佣金／印花稅／利息／學費，佔咗你一世投入嘅一成二以上 —— 咁先叫韭菜。 */
  if (totalCost > base * 0.12) return 'LEEK_LIFE';
  return 'BOILED_FROG';
}

/* 財富階梯 Level（同教學網一致，唔計自住樓）。

   注意：v 係模型內部嘅數，要先 × 匯率變成顯示貨幣先好同門檻比。 */
function levelOf(v) {
  var rows = LC().levels || [[Infinity, 'Level 5', '']];
  var d = v * curRate();
  for (var i = 0; i < rows.length; i++) if (d < rows[i][0]) return [rows[i][1], rows[i][2]];
  return [rows[rows.length - 1][1], rows[rows.length - 1][2]];
}

/* ============================================================

   每個音 = detune 雙振盪器 + 泛音 + sub bass + 低通 + 完整 ADSR。

    知道嘅資料，唔會洩露下一個回合嘅市場。緊張度上升時：

/* newGame / drift / applyChoice / optionsFor / phaseOf 全部喺 engine.js，
   同 Node 測試共用同一份，唔會走樣。 */

/* ---------- 畫面切換 ---------- */
function show(id){
 ['title','game','end'].forEach(function(s){$(s).classList.toggle('on',s===id);});
}

/* ---------- 回合迴圈 ---------- */
function nextTurn(){
 if(G.turn>=TURNS){finish();return;}
 if(isRuined(G)){G.ruinTurn=G.turn;finish();return;}
 if((G.turn===20||G.turn===45)&&!G.reviewed[G.turn]){
  G.reviewed[G.turn]=1;showReview(G.turn);return;
 }
 G.turn++;
 /* 自動存檔要喺 drift() 之前 —— 讀檔嗰陣 nextTurn() 會再行一次 drift()，
    如果存嘅係 drift 之後嘅姿態，讀返嚟就會被 drift 兩次。 */
 if(G.turn>1)saveGame();
 drift(G);
 var sc=ALL_SCEN[G.turn-1]; curScen=sc; locked=false;
 var ph=phaseOf(G.turn);
 AUD.setPhase(ph);
 /* 音樂緊張度跟你自己嘅回撤走。用你已經見到嘅淨值歷史計，
    唔會攞下一個回合嘅市場資料 —— 音樂唔可以劇透。 */
 var pk=0,h=G.sim.hist;
 for(var i=0;i<h.length;i++)pk=Math.max(pk,h[i]);
 AUD.setTension(pk>0?clamp((1-h[h.length-1]/pk)/0.32,0,1):0);
 $('tNum').textContent=G.turn;
 $('tWhen').textContent=t('turnWhen',Math.round(yearAt(G.turn)),ageAt(G.turn));
 $('tPhase').textContent=PHASE_LABEL[ph];

 var nb=bgURL(sc.bg);
 if($('bg').dataset.cur!==nb){
  $('bg').style.opacity='0';
  setTimeout(function(){$('bg').style.backgroundImage="url('"+nb+"')";
   $('bg').dataset.cur=nb;$('bg').style.opacity='1';},160);
 }
 setFigure(sc);
 if(sc.who&&NAMES[sc.who]){$('nameTag').style.display='block';$('spkName').textContent=NAMES[sc.who];}
 else $('nameTag').style.display='none';

 $('sig').textContent=sc.sig;
 $('res').classList.remove('on');
 $('opts').innerHTML='';
 AUD.page();
 typeText(sc.txt,function(){renderOpts(sc);});
 drawChart(); updHUD();
}

function setFigure(sc){
 var who=sc.spr[0], st=sc.spr[1];
 if(who==='wulong'){
  var stage=G.turn<=20?'rookie':G.turn<=45?'mid':'vet';
  var behind=G.sim.eq<mikeAt(G,G.turn-1)*0.85;
  var auto=stage;
  if(G.ego>200&&stage==='mid')auto='mid_anxious';
  else if(behind&&stage==='mid')auto='mid_anxious';
  else if(behind&&stage==='vet')auto='vet_broken';
  else if(!behind&&stage==='rookie'&&G.turn>1)auto='rookie_excited';
  if(SPRITES.wulong[auto])st=auto;
 }
 var src=chrURL(who,st), A=$('figA'), B=$('figB');
 if(A.dataset.cur===src){A.classList.add('in');return;}
 /* 真正嘅 crossfade：
    舊圖搬去後層之後，要即刻設做完全不透明（暫時熄咗 transition），
    否則佢會由 0 淡「入」—— 即係舊圖同新圖一齊淡入，
    睇落就好似舊人物遲遲唔肯消失。
    然後兩張喺同一幀開始反方向過渡，先至係交叉淡出。 */
 var done=false;
 var swap=function(){
  if(done)return; done=true;      // cache 命中時 onload 同 complete 可能兩邊都行
  if(A.dataset.cur){
   B.src=A.src;
   B.style.transition='none'; B.classList.add('in');
   void B.offsetWidth;                       // 迫佢即刻套用
   B.style.transition='';
  }
  A.style.transition='none'; A.classList.remove('in');
  void A.offsetWidth;
  A.style.transition='';
  A.src=src; A.dataset.cur=src;
  requestAnimationFrame(function(){
   A.classList.add('in');       // 新圖 0 -> 1
   B.classList.remove('in');    // 舊圖 1 -> 0，同一幀開始
  });
 };
 var img=new Image();
 img.onload=img.onerror=swap;
 img.src=src;
 if(img.complete)swap();        // 已經喺 cache 嘅話 onload 可能唔會再射
}

 x.strokeStyle='rgba(122,158,143,.9)';x.lineWidth=1.4;x.beginPath();
 for(i=0;i<n;i++)i?x.lineTo(X(i),Y(b[i])):x.moveTo(X(i),Y(b[i]));

/* ---------- 存檔 ----------
   只存 seed + 決定序列 + 敘事計數。
   讀檔時用 seed 重生成市場、用決定序列重播出淨值 —— 完全對得返，
   而且檔案細好多。 */
var SAVE_KEY='wulongcha:save2', SAVE_VER=3;
function serialise(){
 return JSON.stringify({v:SAVE_VER,t:Date.now(),seed:G.seed,name:G.name,turn:G.turn,
  decs:G.decs,posture:G.posture,ego:G.ego,disc:G.disc,health:G.health,commit:G.commit,
  biasCount:G.biasCount,biasLog:G.biasLog,choices:G.choices,reviewed:G.reviewed,
  idleTurns:G.idleTurns});
}
function saveGame(){
 try{
  var blob=serialise();
  if(window.storage&&window.storage.set){try{window.storage.set(SAVE_KEY,blob)['catch'](function(){});}catch(e){}}
  try{localStorage.setItem(SAVE_KEY,blob);}catch(e){}
  return true;
 }catch(e){return false;}
}
function applySave(o){
 if(!o||o.v!==SAVE_VER)return false;
 G=newGame(o.name,o.seed);
 G.turn=o.turn; G.decs=o.decs||[]; G.posture=o.posture||G.posture;
 G.ego=o.ego||0; G.disc=o.disc||0; G.health=o.health||0; G.commit=o.commit||0;
 G.biasCount=o.biasCount||{}; G.biasLog=o.biasLog||[]; G.choices=o.choices||[];
 G.reviewed=o.reviewed||{}; G.idleTurns=o.idleTurns||0;
 G.sim=replay(G.path,G.decs,{});
 return true;
}
function readSaveRaw(){
 return new Promise(function(res){
  if(window.storage&&window.storage.get){
   try{window.storage.get(SAVE_KEY).then(function(r){
    if(r&&r.value)return res(r.value);
    try{res(localStorage.getItem(SAVE_KEY));}catch(e){res(null);}
   })['catch'](function(){try{res(localStorage.getItem(SAVE_KEY));}catch(e){res(null);}});
   return;
  }catch(e){}
  }
  try{res(localStorage.getItem(SAVE_KEY));}catch(e){res(null);}
 });
}
function clearSave(){
 if(window.storage&&window.storage['delete']){try{window.storage['delete'](SAVE_KEY)['catch'](function(){});}catch(e){}}
 try{localStorage.removeItem(SAVE_KEY);}catch(e){}
}

var PHASE_META={
 20:{eyebrow:'PHASE I · REVIEW',title:'rvTitle20'},
 45:{eyebrow:'PHASE II · REVIEW',title:'rvTitle45'}

function phaseSlice(turn){
 var from=turn===20?0:20,a=G.sim.hist,b=G.mikeHist;
 var mine=a[from]>0?(a[turn]/a[from]-1):0;
 var bench=b[from]>0?(b[turn]/b[from]-1):0;
 var biases=G.biasLog.filter(function(x){return x.turn>from&&x.turn<=turn;});
 var cnt={};biases.forEach(function(x){cnt[x.b]=(cnt[x.b]||0)+1;});
 var top=Object.keys(cnt).map(function(k){return [k,cnt[k]];})
  .sort(function(p,q){return q[1]-p[1];}).slice(0,3);
 var peak=-Infinity,dd=0;
 for(var i=from;i<=turn;i++){peak=Math.max(peak,a[i]);if(peak>0)dd=Math.min(dd,a[i]/peak-1);}
 var out=0;for(i=from;i<G.sim.invFracHist.length&&i<turn;i++)if(G.sim.invFracHist[i]<0.5)out++;
 return {from:from,to:turn,mine:mine,bench:bench,biases:biases.length,top:top,dd:dd,out:out};
}

   '· '+chLink('CH6',t('nextCh6'))+'<br>'+

   '· '+chLink('CH3',t('nextCh3'))+'<br>'+
   '· '+chLink('CH5',t('nextCh5'))+'<br>'+
   '· '+chLink('APA',t('nextApA'))+'</div>';
 }

 h+='<div class="endbtns">'+
  '<button class="btn sm" id="again">'+esc(t('btnAgain'))+'</button>'+
  '<button class="btn sm ghost" id="ng2">'+esc(t('btnNg2'))+'</button>'+
  (HAS_SITE?'<button class="btn sm ghost" id="toSite">'+esc(t('btnToSite'))+'</button>':'')+
  '</div>';
 h+='<div class="foot">'+t('endFoot')+'</div>';

 $('eExtra').innerHTML=h;
 /* 即刻鎖定個比率再傳入去 —— 唔可以喺 timer 入面先讀 G，
    因為嗰陣玩家可能已經撳咗「再玩一次」，G 換咗做新一局。 */
 var mineRatio=mikeEq>0?G.sim.eq/mikeEq:0;
 setTimeout(function(){drawMC(mc,mineRatio);},50);
 $('again').onclick=function(){AUD.click();OPTS.tags=0;saveOpts();show('title');AUD.startMusic('rookie');};
 $('ng2').onclick=function(){AUD.click();OPTS.tags=1;saveOpts();applyOpts();startGame(G.name);};
 /* 返教學網：跟返 locale 嘅第 6 章位置（台灣版喺 ../zh-TW/ 之下） */
 if($('toSite'))$('toSite').onclick=function(){location.href=CH.CH6[1];};
}
function stat(l,v){return '<div class="stat"><span>'+l+'</span><span class="v">'+v+'</span></div>';}

function drawMC(mc,mine){
 var c=$('mc');if(!c)return;
 var W=c.clientWidth,H=170,dpr=window.devicePixelRatio||1;
 if(!W)return;
 c.width=W*dpr;c.height=H*dpr;
 var x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
 var res=mc.ratios,N=res.length;
 var below=0;for(var i=0;i<N;i++)if(res[i]<mine)below++;
 var pctl=below/N*100;
 var lo=0,hi=Math.max(1.35,res[Math.floor(N*0.985)]);
 var B=42,bins=new Array(B);for(i=0;i<B;i++)bins[i]=0;
 res.forEach(function(r){var b=Math.min(B-1,Math.floor((r-lo)/(hi-lo)*B));if(b>=0)bins[b]++;});
 var mxb=Math.max.apply(null,bins),pad=20;
 bins.forEach(function(v,i){
  var bw=(W-pad*2)/B,bx=pad+i*bw,bh=(H-34)*(v/mxb);
  var ctr=lo+(i+0.5)/B*(hi-lo);
  x.fillStyle=ctr>1?'rgba(79,148,99,.55)':'rgba(192,74,62,.42)';
  x.fillRect(bx,H-24-bh,Math.max(1,bw-1),bh);
 });
 var x1=pad+(1-lo)/(hi-lo)*(W-pad*2);
 x.strokeStyle='rgba(122,158,143,.9)';x.lineWidth=1.4;x.setLineDash([4,3]);
 x.beginPath();x.moveTo(x1,6);x.lineTo(x1,H-24);x.stroke();x.setLineDash([]);
 x.font='9px sans-serif';x.textAlign='center';
 x.fillStyle='rgba(122,158,143,.95)';x.fillText('Mike',x1,H-12);
 var xm=pad+(Math.min(mine,hi)-lo)/(hi-lo)*(W-pad*2);
 x.strokeStyle='#e8e4d9';x.lineWidth=2;
 x.beginPath();x.moveTo(xm,6);x.lineTo(xm,H-24);x.stroke();
 x.fillStyle='#e8e4d9';x.fillText(t('mcYou'),xm,H-12);
 x.textAlign='left';

 $('mcTxt').innerHTML=t('mcTxt',(mc.win*100).toFixed(1),mc.med.toFixed(2),pctl.toFixed(0),
  pctl>85?t('mcHigh'):pctl<15?t('mcLow'):t('mcMid'));
}

/* ---------- 啟動 ---------- */
function startGame(name){
 G=newGame(name);
 show('game');
 AUD.startMusic('rookie');
 nextTurn();
}
function resumeGame(){
 show('game');
 AUD.startMusic(phaseOf(Math.max(1,G.turn)));
 G.turn=Math.max(0,G.turn-1);   // nextTurn() 會加返
 nextTurn();
}

loadOpts();
/* 語言要喺任何嘢畫出嚟之前定 —— applyLocale() 會蓋咗場景／偏誤／結局嘅文字。 */
initLang(OPTS.lang);
applyOpts();
$('titleBg').style.backgroundImage="url('"+uiURL('ui_title_keyart')+"')";
/* 跟語言填返啲有金額／預設名嘅位 */
$('nameIn').value=t('defaultName');
$('tNote').innerHTML=t('titleNote',fmt(START));
$('hNav').textContent=fmt(START);
$('hBen').textContent=fmt(START);
var lk=$('lnkCh6');
if(lk){ if(!HAS_SITE)lk.style.display='none'; else lk.href=CH.CH6[1]; }

/* ---------- 換語言 ----------
   換咗之後成版嘢都要重新蓋一次 overlay，最乾淨嘅做法係 reload。
   打緊機嘅話先自動存檔，再帶住 resume=1 返嚟，接返落去同一個回合。 */
function switchLang(code){
 if(!LANGS[code]||code===LANG)return;
 AUD.click();
 OPTS.lang=code;saveOpts();
 var mid=!!(G&&$('game').classList.contains('on'));
 if(mid)saveGame();
 location.replace(location.pathname+'?lang='+encodeURIComponent(code)+(mid?'&resume=1':''));
}
/* 自動接返落去嗰陣，瀏覽器仲未收過用戶手勢，開唔到音訊。
   等佢第一下撳／撳掣先補開。 */
function armAudioOnce(){
 var go=function(){
  document.removeEventListener('pointerdown',go);document.removeEventListener('keydown',go);
  AUD.init();AUD.resume();AUD.startMusic(phaseOf(Math.max(1,G?G.turn:1)));
 };
 document.addEventListener('pointerdown',go);document.addEventListener('keydown',go);
}

$('startBtn').onclick=function(){
 AUD.init();AUD.resume();AUD.select();
 var nm=($('nameIn').value||t('defaultName')).trim().slice(0,8)||t('defaultName');
 startGame(nm);
};
$('nameIn').addEventListener('keydown',function(e){if(e.key==='Enter')$('startBtn').click();});
$('next').onclick=function(){AUD.click();nextTurn();};
$('rvNext').onclick=function(){AUD.click();$('review').classList.remove('on');nextTurn();};
$('rvSave').onclick=function(){AUD.select();var b=$('rvSave');
 if(saveGame()){b.textContent=t('btnSaved');b.classList.add('ok');}else b.textContent=t('btnSaveFail');};
$('logBtn').onclick=function(){AUD.click();showLog();};
$('logClose').onclick=function(){AUD.click();$('logOvl').classList.remove('on');};
$('setBtn').onclick=function(){AUD.click();applyOpts();$('setOvl').classList.add('on');};
$('setClose').onclick=function(){AUD.click();$('setOvl').classList.remove('on');};
$('setSave').onclick=function(){AUD.select();var b=$('setSave');
 if(G&&saveGame()){b.textContent=t('btnSaved');b.classList.add('ok');}else b.textContent=t('btnSaveFail');};

function bindSeg(id,key,after){
 var seg=$(id);if(!seg)return;
 [].forEach.call(seg.children,function(b){
  b.onclick=function(){OPTS[key]=+b.dataset.v;saveOpts();applyOpts();AUD.click();after&&after();};
 });
}
bindSeg('segSpeed','speed');
bindSeg('segSound','sound',function(){AUD.setOn(OPTS.sound);});
bindSeg('segTags','tags',function(){if(curScen&&!locked)renderOpts(curScen);});
/* 語言唔行 bindSeg —— 佢個值係字串，而且改完要 reload。
   啲掣跟 LANGS 生成，label 用該語言自己嘅寫法（廣東話 / 繁體中文 / English），
   所以加語言唔使改 shell.html。 */
(function(){var seg=$('segLang');if(!seg)return;
 var codes=[DEFAULT_LANG];for(var c in LANGS)if(c!==DEFAULT_LANG)codes.push(c);
 codes.forEach(function(code){
  var b=document.createElement('button');
  b.dataset.v=code;b.textContent=LANGS[code].label||code;
  if(code===LANG)b.classList.add('on');
  b.onclick=function(){switchLang(code);};
  seg.appendChild(b);
 });})();

document.addEventListener('keydown',function(e){
 if($('review').classList.contains('on')){if(e.key==='Enter'||e.key===' ')$('rvNext').click();return;}
 if($('logOvl').classList.contains('on')||$('setOvl').classList.contains('on')){
  if(e.key==='Escape'){$('logOvl').classList.remove('on');$('setOvl').classList.remove('on');}return;
 }
 if(!$('game').classList.contains('on'))return;
 if($('res').classList.contains('on')){
  if(e.key==='Enter'||e.key===' '){e.preventDefault();$('next').click();}return;
 }
 var i='abcde'.indexOf(e.key.toLowerCase());
 if(i>=0){var b=document.querySelectorAll('.opt')[i];if(b&&!b.disabled)b.click();}
});
window.addEventListener('resize',function(){if(G&&$('game').classList.contains('on'))drawChart();});

/* 有存檔先出「繼續」。
   如果係啱啱換完語言返嚟（resume=1），就唔使佢再撳一次，直接接返落去。 */
var WANT_RESUME=/[?&]resume=1/.test(String(location.search));
readSaveRaw().then(function(raw){
 if(!raw)return;
 var o=null;try{o=JSON.parse(raw);}catch(e){}
 if(!o||o.v!==SAVE_VER)return;
 if(WANT_RESUME&&applySave(o)){resumeGame();armAudioOnce();return;}
 $('contWrap').style.display='block';
 $('contInfo').textContent=t('contInfo',o.name||t('defaultName'),o.turn,
  new Date(o.t||Date.now()).toLocaleDateString());
 $('contBtn').onclick=function(){
  AUD.init();AUD.resume();AUD.select();
  if(applySave(o))resumeGame();
  else $('contInfo').textContent=t('contFail');
 };
});

</script>
